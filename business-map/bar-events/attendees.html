<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参加者一覧｜Bar動員</title><link rel="stylesheet" href="style.css?v=1.134"><script src="../supabase-config.js?v=1.80" defer></script><script src="model.js?v=1.134" defer></script><script src="cloud.js?v=1.134" defer></script><script src="attendees.js?v=1.134" defer></script>
</head>
<body><main><header><div><p class="eyebrow">BAR EVENTS / ATTENDEES</p><h1>参加者一覧</h1></div><a class="button" href="index.html">入力画面へ</a></header>
<aside class="notice">みんながアップロードした最新の参加予定です。未アップロードの編集は反映されません。閲覧に担当者設定は不要です。</aside>
<section class="panel"><div class="view-heading"><h2 id="viewDate">読み込み中</h2><b id="viewCount"></b></div><p class="muted">通常は参加確定者を表示。管理者モードでは未確定・不参加も編集できます。</p><div id="cloudSummary"></div><div class="row"><input class="grow" id="viewSearch" type="search" aria-label="名前・スポンサーで検索" placeholder="名前・スポンサーで検索"><button id="viewRefresh">更新</button></div><div class="attendee-filters"><label>区分<select id="viewKind"><option value="all">全員</option><option value="member">メンバー</option><option value="prospect">プロスペ</option></select></label><label>時間帯<select id="viewSlot"><option value="all">すべて</option><option value="A">A 17:30〜18:30</option><option value="B">B 18:30〜20:30</option><option value="C">C 21:00〜22:00</option><option value="D">D 22:00〜23:00</option><option value="unset">時間未定</option></select></label></div><div class="slot-legend" aria-label="時間帯の色"><span class="slot-badge slot-A">A 17:30〜</span><span class="slot-badge slot-B">B 18:30〜</span><span class="slot-badge slot-C">C 21:00〜</span><span class="slot-badge slot-D">D 22:00〜</span></div><p class="muted">時間帯別・名前順。複数枠の参加者は各枠に表示します（全体人数は重複なし）。</p><div id="viewRows"></div><p id="viewStatus" role="status"></p><details><summary>グループ別・アップロード状況</summary><div id="groupSummary"></div><ul id="uploadList"></ul></details></section></main></body></html>
