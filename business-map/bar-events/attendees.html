<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参加者一覧｜Barイベント</title><link rel="stylesheet" href="style.css?v=1.126"><script src="../supabase-config.js?v=1.80" defer></script><script src="model.js?v=1.126" defer></script><script src="cloud.js?v=1.126" defer></script><script src="attendees.js?v=1.126" defer></script>
<style>.attendee-table{width:100%;border-collapse:collapse;table-layout:fixed}.attendee-table th,.attendee-table td{text-align:left;padding:14px 6px;border-bottom:1px solid #e0e9e4;vertical-align:top;overflow-wrap:anywhere}.attendee-table th{font-size:12px;color:#607b6f}.attendee-table th:nth-child(1){width:32%}.attendee-table th:nth-child(2){width:28%}.attendee-table th:nth-child(3){width:40%}.time-label{display:block;font-size:12px;line-height:1.7}.view-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.view-heading h2{margin:12px 0}.view-heading b{white-space:nowrap}.attendee-table td:first-child{font-weight:600}#viewStatus{font-size:12px;line-height:1.6;color:#607b6f}</style></head>
<body><main><header><div><p class="eyebrow">BAR EVENTS / ATTENDEES</p><h1>参加者一覧</h1></div><a class="button" href="index.html">入力画面へ</a></header>
<aside class="notice">みんながアップロードした最新の参加予定です。未アップロードの編集は反映されません。閲覧に担当者設定は不要です。</aside>
<section class="panel"><div class="view-heading"><h2 id="viewDate">読み込み中</h2><b id="viewCount"></b></div><p class="muted">直近の開催回の「○参加確定」のみ。未確定・不参加は一覧に含みません。</p><p id="cloudSummary" class="muted"></p><div class="row"><input class="grow" id="viewSearch" type="search" aria-label="名前・スポンサーで検索" placeholder="名前・スポンサーで検索"><button id="viewRefresh">更新</button></div><table class="attendee-table"><thead><tr><th scope="col">名前</th><th scope="col">スポンサー</th><th scope="col">時間帯</th></tr></thead><tbody id="viewRows"></tbody></table><p id="viewStatus" role="status"></p><details><summary>グループ別・アップロード状況</summary><div id="groupSummary"></div><ul id="uploadList"></ul></details></section></main></body></html>
