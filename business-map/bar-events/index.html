<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barイベント｜試用版</title><link rel="stylesheet" href="style.css"><script src="model.js" defer></script><script src="app.js" defer></script></head>
<body><main>
 <header><div><p class="eyebrow">BUSINESS MAP / BAR EVENTS</p><h1>Barイベント</h1></div><a class="button" href="../index.html">マップに戻る</a></header>
 <aside class="notice"><strong>端末内で試せるプレビュー版</strong><br>まだ他の人とは共有されません。「全体」はこの端末の登録分です。本番の共有接続は準備中。マップや既存の採点データは変更しません。</aside>
 <section class="panel identity"><label>自分（担当者）<input id="owner" list="ownerNames" placeholder="初回だけ自分の名前を設定"><datalist id="ownerNames"></datalist></label><button id="remember">この名前で使う</button><span id="ownerState"></span></section>
 <section class="panel"><div class="row"><label class="grow">開催回<select id="event"></select></label><button id="newEvent">開催回を作る</button></div><div id="totals" class="stats"></div><p id="times" class="muted"></p></section>
 <nav aria-label="表示切り替え"><button data-tab="list" aria-pressed="true">参加者</button><button data-tab="past">過去プロスペ</button><button data-tab="summary">集計</button></nav>
 <section class="panel"><div class="row"><label class="grow">表示範囲<select id="scope"><option value="mine">自分の担当</option><option value="all">全体（この端末）</option></select></label><label class="grow">名前・スポンサー検索<input id="search" type="search" placeholder="検索"></label></div><div id="actions" class="row"><button id="fromMap">マップから追加</button><button id="manual">名前を直接入力</button></div><div id="content"></div></section>
 <footer><button id="undo">直前の変更を取り消す</button><button id="backup">イベントJSON保存</button><details><summary>変更履歴（直近20件）</summary><ol id="history"></ol></details></footer>
 <p id="message" role="status" aria-live="polite"></p>
 <dialog id="dialog"><form id="form"><div class="row"><h2 id="dialogTitle" class="grow"></h2><button type="button" id="close" aria-label="閉じる">✕</button></div><div id="fields"></div><button class="primary" type="submit">保存</button></form></dialog>
</main></body></html>
