<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barイベント｜試用版</title><link rel="stylesheet" href="style.css"><script src="model.js" defer></script><script src="app.js" defer></script></head>
<body><main>
 <header><div><p class="eyebrow">BUSINESS MAP / BAR EVENTS</p><h1>Barイベント</h1></div><div class="row"><a class="button" href="attendees.html">参加者一覧を見る</a><a class="button" href="../index.html">マップに戻る</a></div></header>
 <aside class="notice"><strong>端末内で試せるプレビュー版</strong><br>まだ他の人とは共有されません。「全体」はこの端末の登録分です。本番の共有接続は準備中。マップや既存の採点データは変更しません。</aside>
 <details class="panel" id="identityPanel"><summary id="ownerState">入力担当者を設定（閲覧だけなら不要）</summary><div class="identity"><label>自分（担当者）<input id="owner" list="ownerNames" placeholder="初回だけ自分の名前を設定"><datalist id="ownerNames"></datalist></label><button id="remember">この名前で使う</button></div></details>
 <section class="panel"><div class="row"><div class="grow"><span class="muted">直近の開催日</span><h2 id="eventDate"></h2></div><details><summary>開催日の設定</summary><button id="newEvent">開催日を登録</button></details></div><div id="totals" class="stats"></div><p id="times" class="muted"></p></section>
 <nav aria-label="表示切り替え"><button data-tab="list" aria-pressed="true">参加者</button><button data-tab="past">過去プロスペ</button><button data-tab="summary">集計</button></nav>
 <section class="panel"><div class="row"><label class="grow">表示範囲<select id="scope"><option value="all">全参加者（この端末）</option><option value="mine">自分の担当だけ</option></select></label><label class="grow">検索<input id="search" type="search" placeholder="名前・スポンサー"></label></div><div id="actions"><form id="quickAdd" class="row quick-add"><input class="grow" id="quickName" aria-label="追加する名前" placeholder="名前を入力 → Enterで追加" maxlength="80" required><select id="quickKind" aria-label="参加者区分"><option value="prospect">プロスペ</option><option value="member">メンバー</option></select><button class="primary" type="submit">＋追加</button></form><p class="muted" id="quickHint"></p><div class="row"><button id="fromMap">マップからまとめて追加</button><button id="manual">スポンサーを指定して追加</button></div></div><p class="muted">○ 確定／△ 未確定／× 不参加。出欠・時間はタップで自動保存。</p><div id="content"></div></section>
 <footer><button id="undo">直前の変更を取り消す</button><button id="backup">イベントJSON保存</button><details><summary>変更履歴（直近20件）</summary><ol id="history"></ol></details></footer>
 <p id="message" role="status" aria-live="polite"></p>
 <dialog id="dialog"><form id="form"><div class="row"><h2 id="dialogTitle" class="grow"></h2><button type="button" id="close" aria-label="閉じる">✕</button></div><div id="fields"></div><button class="primary" type="submit">保存</button></form></dialog>
</main></body></html>
