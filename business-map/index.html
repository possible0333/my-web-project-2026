<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Map v1.71</title>
<script src="config/version.js?v=1.71"></script>
<link rel="stylesheet" href="v103-style.css?v=1.03">
<link rel="stylesheet" href="v104-image-save.css?v=1.04">

<link rel="stylesheet" href="v109-polish.css?v=1.09">
<link rel="stylesheet" href="v111-density.css?v=1.11">
<link rel="stylesheet" href="v114-card-readability.css?v=1.14">
<link rel="stylesheet" href="v116-status-workflow.css?v=1.16">
<link rel="stylesheet" href="v117-core-fields.css?v=1.17">
<link rel="stylesheet" href="v118-filter-hierarchy.css?v=1.18">
<link rel="stylesheet" href="v119-next-action.css?v=1.20">
<link rel="stylesheet" href="v121-card-priority.css?v=1.71">
<link rel="stylesheet" href="v127-direct-zone.css?v=1.71">
<link rel="stylesheet" href="v128-self-focus.css?v=1.28">
<link rel="stylesheet" href="v129-compact-members.css?v=1.29">
<link rel="stylesheet" href="v130-mobile.css?v=1.30">
<link rel="stylesheet" href="v136-share.css?v=1.71">
<link rel="stylesheet" href="css/product-ui.css?v=1.71">
<link rel="stylesheet" href="css/share-controls.css?v=1.71">
<link rel="stylesheet" href="v156-schedule.css?v=1.71">
<style>
  .map-share-actions{display:flex;flex-direction:column;gap:10px;width:min(520px,100%);margin:14px auto 4px;padding:0 8px;box-sizing:border-box}
  .map-share-actions .btn{width:100%;min-height:50px;font-size:15px;font-weight:800;border-radius:14px}
  .map-share-actions #uploadMapBtn{background:#0f766e;color:#fff;border-color:#0f766e}
  .post-map-summary{margin-top:16px}
  @media (max-width:720px){
    .map-share-actions{width:100%;padding:0 2px;gap:8px;margin-top:12px}
    .map-share-actions .btn{min-height:52px;font-size:16px}
    .post-map-summary{margin-top:14px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand">Business Map <small>v1.71</small></div>
      <div class="sub">PV・ネットワーク・GrPV管理</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="jsonExportBtn">JSON保存</button>
      <button class="btn" id="jsonImportBtn">JSON読込</button>
    </div>
  </div>

  <section class="self-card" id="selfCard"></section>

  <section class="section">
    <div class="section-head">
      <h2>ネットワークマップ</h2>
      <div class="controls">
        <select class="select" id="statusFilter" style="width:auto;min-width:160px"></select>
        <select class="select" id="typeFilter" style="width:auto;min-width:140px"></select>
        <button class="btn primary" id="addBtn">＋ メンバー追加</button>
        <button class="btn" id="editSelfBtn">自分を編集</button>
        <button class="btn danger" id="resetActualPvBtn" type="button">実績PVを全員リセット</button>
      </div>
    </div>
    <div class="map-wrap">
      <div class="legend" id="legend"></div>
      <div class="map-canvas" id="mapCanvasArea">
        <svg class="tree-lines" id="treeLines"></svg>
        <div id="treeRows"></div>
      </div>
    </div>

    <div class="map-share-actions" aria-label="マップ共有・保存">
      <button class="btn primary" id="uploadMapBtn">アップロード</button>
      <button class="btn dark" id="saveImageBtn">画像保存</button>
    </div>

    <div class="footer-note">自動保存先：このブラウザのlocalStorage（電源を落としても通常は消えません）</div>
  </section>

  <div class="post-map-summary">
    <section class="summary-grid" id="statusSummary"></section>
    <section class="type-row" id="typeSummary"></section>
  </div>
</div>

<input id="fileInput" type="file" accept="application/json" hidden>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="modalTitle">メンバー編集</div>
      <button class="btn ghost close-action">閉じる</button>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right">
        <button class="btn danger" id="deleteBtnTop">削除</button>
        <button class="btn primary save-action">保存</button>
      </div>
    </div>

    <div class="form-grid" style="margin-top:10px">
      <div class="field full v116-status-priority">
        <div class="v116-status-head">
          <label for="fStatus">ステータス</label>
          <span class="v116-status-important">最重要</span>
        </div>
        <select class="select" id="fStatus"></select>
        <div class="v116-status-helper">「来月以降」を選ぶと、この人は通常マップから外れ、右上の「来月以降」枠へ自動で移動します。</div>
      </div>

      <div class="field full v117-core-field v117-name-priority">
        <div class="v117-core-head">
          <label for="fName">名前</label>
          <span class="v117-core-badge">重要</span>
        </div>
        <input class="text-input" id="fName" placeholder="名前を入力">
      </div>

      <div class="field v117-core-field v117-pv-priority">
        <div class="v117-core-head">
          <label for="fTarget">目標PV</label>
          <span class="v117-core-badge">重要</span>
        </div>
        <input class="number-input" id="fTarget" type="number" min="0" step="1000" inputmode="numeric">
        <div class="v117-pv-helper">今月の個人PV目標</div>
      </div>

      <div class="field v117-core-field v117-pv-priority">
        <div class="v117-core-head">
          <label for="fActual">実績PV</label>
          <span class="v117-core-badge">重要</span>
        </div>
        <input class="number-input" id="fActual" type="number" min="0" step="1000" inputmode="numeric">
        <div class="v117-pv-helper">現在の個人PV実績</div>
      </div>

      <div class="field"><label>区分</label><select class="select" id="fType"></select></div>
      <div class="field" id="sponsorField"><label>スポンサー</label><select class="select" id="fSponsor"></select></div>
      <div class="field full hidden" id="customStatusWrap"><label>自由入力ステータス</label><input class="text-input" id="fCustomStatus" placeholder="例：保留 / 検討中 / 旅行中 など"></div>
      <div class="field"><label>年齢</label><input class="text-input" id="fAge" placeholder="例：26歳"></div>
      <div class="field"><label>職業</label><input class="text-input" id="fJob" placeholder="例：看護師"></div>
      <div class="field"><label>趣味</label><input class="text-input" id="fHobby" placeholder="例：カフェ巡り"></div>
      <div class="field"><label>etc</label><input class="text-input" id="fEtc" placeholder="例：猫好き / 夜勤多め"></div>
      <div class="field full"><label>メモ1</label><input class="text-input" id="fMemo1" placeholder="短いメモを入力"></div>
      <div class="field full"><label>メモ2</label><input class="text-input" id="fMemo2" placeholder="短いメモを入力"></div>
      <div class="field full"><label>メモ3</label><input class="text-input" id="fMemo3" placeholder="短いメモを入力"></div>
      <div class="field full">
        <label>顔アイコン</label>
        <div class="avatars" id="avatarPicker"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost close-action">閉じる</button>
      <div class="right">
        <button class="btn danger" id="deleteBtnBottom">削除</button>
        <button class="btn primary save-action">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="export-root" id="exportRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>

<script src="v103-compat.js?v=1.03"></script>

<script src="v114-card-readability.js?v=1.14"></script>
<script src="v116-status-workflow.js?v=1.16"></script>
<script src="v117-core-fields.js?v=1.17"></script>
<script src="v118-filter-hierarchy.js?v=1.18.1"></script>
<script src="v119-next-action.js?v=1.20"></script>
<script src="v121-card-priority.js?v=1.21.1"></script>
<script src="v122-full-export.js?v=1.22.1"></script>
<script src="v123-grpv.js?v=1.23"></script>
<script src="v125-amway-pv.js?v=1.25"></script>
<script src="v126-pv-consistency.js?v=1.71"></script>
<script src="v126-full-export.js?v=1.26.1"></script>
<script src="v127-direct-zone.js?v=1.71"></script>
<script src="v128-self-focus.js?v=1.28"></script>
<script src="v130-mobile-export.js?v=1.71"></script>
<script src="v131-tight-export.js?v=1.31"></script>
<script src="v132-grpv-terminology.js?v=1.71"></script>
<script src="v135-export.js?v=1.71"></script>
<script src="supabase-config.js?v=1.71"></script>
<script src="v136-share.js?v=1.71"></script>
<script src="v156-schedule.js?v=1.71"></script>
<script src="js/ui/product-shell.js?v=1.71"></script>
</body>
</html>
