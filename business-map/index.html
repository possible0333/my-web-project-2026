<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Map v1.13</title>
<link rel="stylesheet" href="v103-style.css?v=1.03">
<link rel="stylesheet" href="v104-image-save.css?v=1.04">
<link rel="stylesheet" href="v107-stable.css?v=1.07">
<link rel="stylesheet" href="v109-polish.css?v=1.09">
<link rel="stylesheet" href="v111-density.css?v=1.11">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand">Business Map <small>v1.13</small></div>
      <div class="sub">PV・ネットワーク・Group PV管理</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="jsonExportBtn">JSON保存</button>
      <button class="btn" id="jsonImportBtn">JSON読込</button>
      <button class="btn dark" id="saveImageBtn">画像保存</button>
    </div>
  </div>

  <section class="self-card" id="selfCard"></section>
  <section class="summary-grid" id="statusSummary"></section>
  <section class="type-row" id="typeSummary"></section>

  <section class="section">
    <div class="section-head">
      <h2>ネットワークマップ</h2>
      <div class="controls">
        <select class="select" id="statusFilter" style="width:auto;min-width:160px"></select>
        <select class="select" id="typeFilter" style="width:auto;min-width:140px"></select>
        <button class="btn primary" id="addBtn">＋ メンバー追加</button>
        <button class="btn" id="editSelfBtn">自分を編集</button>
      </div>
    </div>
    <div class="map-wrap">
      <div class="legend" id="legend"></div>
      <div class="map-canvas" id="mapCanvasArea">
        <svg class="tree-lines" id="treeLines"></svg>
        <div id="treeRows"></div>
      </div>
    </div>
    <div class="footer-note">自動保存先：このブラウザのlocalStorage（電源を落としても通常は消えません）</div>
  </section>
</div>

<input id="fileInput" type="file" accept="application/json" hidden>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="modalTitle">メンバー編集</div>
      <button class="btn ghost close-action">閉じる</button>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right">
        <button class="btn danger" id="deleteBtnTop">削除</button>
        <button class="btn primary save-action">保存</button>
      </div>
    </div>

    <div class="form-grid" style="margin-top:10px">
      <div class="field"><label>名前</label><input class="text-input" id="fName"></div>
      <div class="field"><label>区分</label><select class="select" id="fType"></select></div>
      <div class="field" id="sponsorField"><label>スポンサー</label><select class="select" id="fSponsor"></select></div>
      <div class="field"><label>目標個人PV</label><input class="number-input" id="fTarget" type="number" min="0" step="1000"></div>
      <div class="field"><label>実績PV</label><input class="number-input" id="fActual" type="number" min="0" step="1000"></div>
      <div class="field"><label>ステータス</label><select class="select" id="fStatus"></select></div>
      <div class="field full hidden" id="customStatusWrap"><label>自由入力ステータス</label><input class="text-input" id="fCustomStatus" placeholder="例：保留 / 検討中 / 旅行中 など"></div>
      <div class="field"><label>年齢</label><input class="text-input" id="fAge" placeholder="例：26歳"></div>
      <div class="field"><label>職業</label><input class="text-input" id="fJob" placeholder="例：看護師"></div>
      <div class="field"><label>趣味</label><input class="text-input" id="fHobby" placeholder="例：カフェ巡り"></div>
      <div class="field"><label>etc</label><input class="text-input" id="fEtc" placeholder="例：猫好き / 夜勤多め"></div>
      <div class="field full"><label>メモ1</label><input class="text-input" id="fMemo1" placeholder="短いメモを入力"></div>
      <div class="field full"><label>メモ2</label><input class="text-input" id="fMemo2" placeholder="短いメモを入力"></div>
      <div class="field full"><label>メモ3</label><input class="text-input" id="fMemo3" placeholder="短いメモを入力"></div>
      <div class="field full">
        <label>顔アイコン</label>
        <div class="avatars" id="avatarPicker"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost close-action">閉じる</button>
      <div class="right">
        <button class="btn danger" id="deleteBtnBottom">削除</button>
        <button class="btn primary save-action">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="export-root" id="exportRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="v103-app-1.js?v=1.03"></script>
<script src="v103-compat.js?v=1.03"></script>
<script src="v103-app-2.js?v=1.03"></script>
<script src="v104-image-save.js?v=1.11"></script>
<script src="v107-stable.js?v=1.07"></script>
<script src="v109-polish.js?v=1.09"></script>
<script src="v110-export-lines.js?v=1.10"></script>
<script src="v111-density.js?v=1.11"></script>
<script src="v112-dom-capture.js?v=1.12"></script>
<script src="v113-lines.js?v=1.13"></script>
</body>
</html>
