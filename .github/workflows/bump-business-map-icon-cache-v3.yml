name: Bump Business Map icon cache v3
on:
  push:
    paths:
      - 'business-map/icons/avatar-13.webp'
      - 'business-map/icons/avatar-31.webp'
      - 'business-map/icons/avatar-33.webp'
      - 'business-map/icons/avatar-35.webp'
      - 'business-map/icons/avatar-36.webp'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump icon cache version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('business-map/index.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r"const ICON_VERSION='[^']+'", "const ICON_VERSION='20260810-funnybatch-v3'", s, count=1)
          if s2 == s and "20260810-funnybatch-v3" not in s:
              raise SystemExit('ICON_VERSION not found')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-map/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Bump Business Map icon cache v3'
            git push
          fi
