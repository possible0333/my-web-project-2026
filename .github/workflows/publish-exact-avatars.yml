name: Publish exact Business Map avatars

on:
  push:
    paths:
      - 'business-map/avatar-bundle.b64'
      - '.github/workflows/publish-exact-avatars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact avatars and patch app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p business-map/icons
          base64 -d business-map/avatar-bundle.b64 > /tmp/exact-icons.zip
          unzip -o /tmp/exact-icons.zip -d business-map/icons
          test "$(find business-map/icons -maxdepth 1 -name 'avatar-*.webp' | wc -l)" -eq 36

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('business-map/index.html')
          s = p.read_text(encoding='utf-8')

          # Use the approved 36 icons as individual WebP files. No sprites/SVG redraws.
          s = s.replace('.svg?v=${ICON_VERSION}', '.webp?v=${ICON_VERSION}')
          s = s.replace('.png?v=${ICON_VERSION}', '.webp?v=${ICON_VERSION}')
          s = s.replace('icons/avatar-01.svg', 'icons/avatar-01.webp')
          s = s.replace('icons/avatar-36.svg', 'icons/avatar-36.webp')
          s = s.replace('icons/avatar-01.png', 'icons/avatar-01.webp')
          s = s.replace('icons/avatar-36.png', 'icons/avatar-36.webp')
          s = re.sub(r'const ICON_VERSION\s*=\s*"[^"]+";', 'const ICON_VERSION = "20260810-exact36-v1";', s, count=1)

          # Visible version marker for cache/debug confirmation.
          s = s.replace('v10.2 exact icons', 'v10.3 exact icons')
          s = s.replace('v10.1 exact icons', 'v10.3 exact icons')
          s = s.replace('v10.0 external icons', 'v10.3 exact icons')
          s = s.replace('v9.0 external icons', 'v10.3 exact icons')
          for old in ('>v10.2<', '>v10.1<', '>v10.0<', '>v9.0<'):
              s = s.replace(old, '>v10.3<')

          p.write_text(s, encoding='utf-8')
          PY

          grep -q '.webp?v=${ICON_VERSION}' business-map/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-map/index.html business-map/icons/avatar-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved 36 Business Map avatars"
            git push
          fi
