name: Bump Business Map image layout cache
on:
  push:
    paths:
      - 'business-map/enhance-v1-domcapture.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump DOM capture script cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('business-map/index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'enhance-v1-domcapture\.js(?:\?v=[^"\']+)?'
          repl='enhance-v1-domcapture.js?v=mapmain2'
          s2,n=re.subn(pat,repl,s,count=1)
          if n != 1:
              raise SystemExit('domcapture script reference not found')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-map/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Bump Business Map image layout cache'
            git push
          fi
