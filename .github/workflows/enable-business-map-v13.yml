name: Enable Business Map v13
on:
  push:
    paths:
      - '.github/workflows/enable-business-map-v13.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Business Map index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('business-map/index.html')
          s=p.read_text(encoding='utf-8')
          if 'enhance-v13.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="enhance-v13.css?v=13"></head>')
          if 'enhance-v13.js' not in s:
              s=s.replace('</body>','<script src="enhance-v13.js?v=13"></script></body>')
          s=re.sub(r'<title>Business Map v(?:11\.1|12)</title>','<title>Business Map v13</title>',s)
          s=re.sub(r'<span class="ver">v(?:11\.1|12)</span>','<span class="ver">v13</span>',s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-map/index.html
          git commit -m 'Enable Business Map v13 compact summary' || exit 0
          git push
